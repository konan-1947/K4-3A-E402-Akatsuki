spring.application.name=studypulse-be
spring.config.import=optional:file:.env[.properties]

# Secrets can be kept in the local .env file. Do not commit that file.
app.ai.openai.api-key=${APP_AI_OPENAI_API_KEY:}
app.ai.openai.base-url=${APP_AI_OPENAI_BASE_URL:https://api.openai.com}
app.ai.openai.default-model=${APP_AI_OPENAI_DEFAULT_MODEL:gpt-4o-mini}

# DeepSeek exposes an OpenAI-compatible chat-completions API.
app.ai.deepseek.api-key=${APP_AI_DEEPSEEK_API_KEY:}
app.ai.deepseek.base-url=${APP_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.ai.deepseek.default-model=${APP_AI_DEEPSEEK_DEFAULT_MODEL:deepseek-chat}

spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:200MB}
app.mental-model.runs-dir=${APP_MENTAL_MODEL_RUNS_DIR:runs}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
